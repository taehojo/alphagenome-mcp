name: Publish to npm

# Publishes when a GitHub release is published. It can also be started by hand
# for a tag whose publish failed, without recreating the release:
#   gh workflow run publish.yml -f tag=v0.3.0
#
# Authentication: npm trusted publishing (OIDC). Configure it once on npmjs.com
# (package Settings > Trusted Publisher > GitHub Actions: this repository and
# the workflow filename publish.yml). npm uses OIDC before it falls back to a
# token, so NPM_TOKEN is only a fallback; a token needs "bypass 2FA" to publish
# from CI, and npm is removing direct publishing with tokens in January 2027.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.3.0'
        required: true

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Release tag matches the package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "package: ${VERSION}, tag: ${RELEASE_TAG}"
          test "${VERSION}" = "${RELEASE_TAG}"

      - name: Not published yet
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@jolab/alphagenome-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@jolab/alphagenome-mcp@${VERSION} is already on npm"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Tool reference is up to date
        run: npm run docs:api:check

      # A trusted publisher created after 2026-09-03 allows `npm stage publish`
      # only, unless direct publishing is switched on in its settings. So:
      # publish directly when that is allowed; otherwise stage the version,
      # and a maintainer approves it with 2FA (`npm stage approve <stage-id>`).
      - name: Publish to npm, or stage for approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          set +e
          npm publish --provenance --access public 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Published @jolab/alphagenome-mcp@${VERSION}: https://www.npmjs.com/package/@jolab/alphagenome-mcp/v/${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -qE "E403|EOTP|OIDC permission denied" publish.log; then
            echo "npm publish failed for a reason staging would not fix"; exit "$status"
          fi
          echo "Direct publishing is not allowed for this publisher; staging instead."
          # The exit status is read from PIPESTATUS: piping into tee would
          # otherwise report tee's success and hide a failed staging.
          set +e
          npm stage publish --provenance --access public 2>&1 | tee stage.log
          stage_status=${PIPESTATUS[0]}
          set -e
          APPROVE="A maintainer approves it with 2FA: \`npm stage list @jolab/alphagenome-mcp\`, then \`npm stage approve <stage-id>\`."
          if [ "$stage_status" -ne 0 ]; then
            if grep -q "E409" stage.log; then
              {
                echo "@jolab/alphagenome-mcp@${VERSION} is already staged and still waiting for approval. It is NOT on npm yet."
                echo "${APPROVE}"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::warning::${VERSION} is already staged and waiting for approval; nothing new was uploaded."
              exit 0
            fi
            echo "npm stage publish failed"; exit "$stage_status"
          fi
          {
            echo "Staged @jolab/alphagenome-mcp@${VERSION}. It is NOT on npm yet."
            echo "${APPROVE}"
            echo '```'; grep -iE "staged" stage.log | tail -3; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::${VERSION} was staged, not published. It needs a maintainer's approval."
