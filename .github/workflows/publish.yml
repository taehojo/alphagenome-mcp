name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Release tag matches the package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "package: ${VERSION}, release tag: ${{ github.event.release.tag_name }}"
          test "${VERSION}" = "${{ github.event.release.tag_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Tool reference is up to date
        run: npm run docs:api:check

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Published @jolab/alphagenome-mcp@${VERSION}: https://www.npmjs.com/package/@jolab/alphagenome-mcp/v/${VERSION}" >> "$GITHUB_STEP_SUMMARY"
